<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Cache Status - HELM PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="toplayer.css" rel="stylesheet" type="text/css">
    <style>
        .cache-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .cache-item:last-child {
            border-bottom: none;
        }
        .cached {
            color: #28a745;
        }
        .not-cached {
            color: #dc3545;
        }
        .progress-container {
            margin: 20px 0;
        }
        .refresh-btn {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1>PWA Cache Status</h1>
                <p><a href="/">&larr; Back to Main Page</a></p>
                
                <div class="progress-container">
                    <h3>Overall Progress</h3>
                    <div class="progress">
                        <div id="overall-progress" class="progress-bar" role="progressbar" style="width: 0%">
                            0%
                        </div>
                    </div>
                    <p id="progress-text">Checking cache status...</p>
                </div>

                <button id="refresh-status" class="btn btn-primary refresh-btn">Refresh Status</button>
                <button id="clear-cache" class="btn btn-warning refresh-btn">Clear All Cache</button>

                <div class="row">
                    <div class="col-md-6">
                        <h3>Essential Files</h3>
                        <div id="essential-files"></div>
                    </div>
                    <div class="col-md-6">
                        <h3>Chapter Files</h3>
                        <div id="chapter-files"></div>
                    </div>
                </div>

                <div class="mt-4">
                    <h3>Service Worker Status</h3>
                    <div id="sw-status"></div>
                </div>

                <div class="mt-4">
                    <h3>Cache Information</h3>
                    <div id="cache-info"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const essentialFiles = [
            '/',
            '/index.html',
            '/toplayer.css',
            '/manifest.json',
            '/img/helmlogo2.png',
            '/img/sigma-logo.png',
            '/img/mashlogo200.gif'
        ];

        async function checkCacheStatus() {
            if (!('caches' in window)) {
                document.getElementById('cache-info').innerHTML = '<p class="text-danger">Cache API not supported</p>';
                return;
            }

            try {
                const cache = await caches.open('helm-v1');
                const cachedRequests = await cache.keys();
                const cachedUrls = cachedRequests.map(req => req.url);

                // Check essential files
                let essentialCached = 0;
                const essentialHtml = essentialFiles.map(file => {
                    const fullUrl = new URL(file, window.location.origin).href;
                    const isCached = cachedUrls.some(url => url.includes(file) || url === fullUrl);
                    if (isCached) essentialCached++;
                    return `<div class="cache-item ${isCached ? 'cached' : 'not-cached'}">
                        ${isCached ? '✓' : '✗'} ${file}
                    </div>`;
                }).join('');

                // Analyze cached files by type
                const chapterFiles = cachedUrls.filter(url => url.includes('-web/'));
                const otherFiles = cachedUrls.filter(url => !url.includes('-web/') && !essentialFiles.some(ef => url.includes(ef)));
                
                // Group chapter files by directory
                const chapterGroups = {};
                chapterFiles.forEach(url => {
                    const match = url.match(/([^\/]+)-web\//);
                    if (match) {
                        const chapterName = match[1];
                        if (!chapterGroups[chapterName]) {
                            chapterGroups[chapterName] = [];
                        }
                        chapterGroups[chapterName].push(url);
                    }
                });

                // Display chapter files grouped by chapter
                const chaptersHtml = Object.keys(chapterGroups).sort().map(chapterName => {
                    const files = chapterGroups[chapterName];
                    return `<div class="cache-item cached">
                        <strong>✓ ${chapterName}</strong> (${files.length} files)
                        <div style="margin-left: 20px; font-size: 0.9em; color: #666;">
                            ${files.map(url => {
                                const fileName = url.split('/').pop();
                                return `<div>• ${fileName}</div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }).join('');

                document.getElementById('essential-files').innerHTML = essentialHtml;
                document.getElementById('chapter-files').innerHTML = chaptersHtml || '<p class="text-muted">No chapter files cached yet</p>';

                // Update progress
                const totalCachedFiles = cachedRequests.length;
                const chapterFileCount = chapterFiles.length;
                
                // Fetch the full list of files to calculate progress
                const response = await fetch('file-list.json');
                if (!response.ok) {
                    throw new Error('Failed to fetch file-list.json');
                }
                const fileList = await response.json();
                const totalFiles = fileList.length;

                const progress = totalFiles > 0 ? (cachedUrls.length / totalFiles) * 100 : 0;
                
                const progressBar = document.getElementById('overall-progress');
                progressBar.style.width = `${progress.toFixed(2)}%`;
                progressBar.textContent = `${progress.toFixed(2)}%`;
                progressBar.className = `progress-bar ${progress === 100 ? 'bg-success' : 'bg-info'}`;

                document.getElementById('progress-text').textContent = 
                    `Cached ${cachedUrls.length} of ${totalFiles} files.`;

                // Cache info
                document.getElementById('cache-info').innerHTML = `
                    <p><strong>Cache Name:</strong> helm-v1</p>
                    <p><strong>Total Cached Items:</strong> ${cachedRequests.length}</p>
                    <p><strong>Essential Files:</strong> ${essentialCached}/${essentialFiles.length}</p>
                    <p><strong>Chapter Files:</strong> ${chapterFileCount}</p>
                    <p><strong>Chapters with Content:</strong> ${Object.keys(chapterGroups).length}</p>
                    <p><strong>Other Files:</strong> ${otherFiles.length}</p>
                `;

            } catch (error) {
                document.getElementById('cache-info').innerHTML = `<p class="text-danger">Error checking cache: ${error.message}</p>`;
            }
        }

        function checkServiceWorkerStatus() {
            if (!('serviceWorker' in navigator)) {
                document.getElementById('sw-status').innerHTML = '<p class="text-danger">Service Worker not supported</p>';
                return;
            }

            navigator.serviceWorker.getRegistration().then(registration => {
                if (registration) {
                    const state = registration.active ? registration.active.state : 'not active';
                    document.getElementById('sw-status').innerHTML = `
                        <p><strong>Status:</strong> <span class="text-success">Registered</span></p>
                        <p><strong>State:</strong> ${state}</p>
                        <p><strong>Scope:</strong> ${registration.scope}</p>
                    `;
                } else {
                    document.getElementById('sw-status').innerHTML = '<p class="text-warning">Service Worker not registered</p>';
                }
            });
        }

        async function clearCache() {
            if (confirm('Are you sure you want to clear all cached data? This will require re-downloading all content.')) {
                try {
                    await caches.delete('helm-v1');
                    alert('Cache cleared successfully! Refresh the page to see updated status.');
                    checkCacheStatus();
                } catch (error) {
                    alert('Error clearing cache: ' + error.message);
                }
            }
        }

        // Event listeners
        document.getElementById('refresh-status').addEventListener('click', () => {
            checkCacheStatus();
            checkServiceWorkerStatus();
        });

        document.getElementById('clear-cache').addEventListener('click', clearCache);

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            checkCacheStatus();
            checkServiceWorkerStatus();
            
            // Auto-refresh every 5 seconds
            setInterval(() => {
                checkCacheStatus();
            }, 5000);
        });
    </script>
</body>
</html>
